<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strong Peggles</title>
<meta name="theme-color" content="#1e5bb8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#14213d;--mut:#5b6b82;--line:#e1e7f0;--pri:#1e5bb8;--pri2:#0b2a5c;--acc:#f58a1f;--ok:#1f9d55;--okbg:#e6f6ec;--warn:#b45309;--warnbg:#fff4e0;--bad:#c0392b;--badbg:#fdecea;
--ord:#1e5bb8;--cho:#e0532b;--est:#7a4bd1;--del:#1f9d55;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{background:linear-gradient(160deg,#2166c9,#0b2a5c);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 18px;border-radius:0 0 26px 26px;margin-bottom:14px}
.toprow{display:flex;align-items:center;gap:12px}
.toprow img{width:54px;height:54px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.brand{font-weight:800;font-size:22px;letter-spacing:.2px}
.sub{opacity:.85;font-size:14px}
.gear{margin-left:auto;background:rgba(255,255,255,.16);border:0;color:#fff;width:44px;height:44px;border-radius:12px;font-size:22px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,33,61,.06)}
.card h2{font-size:19px;margin:0 0 8px}
.card h3{font-size:17px;margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.muted{color:var(--mut)}.small{font-size:14px}.tiny{font-size:12.5px}
.big{font-size:30px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:#e9eef6;color:var(--ink);min-height:50px;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}.btn.acc{background:var(--acc);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.block{width:100%}.btn.sm{min-height:40px;padding:8px 12px;font-size:15px;border-radius:12px}
.btn:active{transform:scale(.98)}
input[type=number],input[type=text],input[type=time],input[type=date],select{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:48px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--pri)}
label.f{display:block;font-size:14px;color:var(--mut);margin:8px 0 4px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.t-ordinaria,.t-ordinaria2{background:var(--ord)}.t-choque{background:var(--cho)}.t-estabilizadora{background:var(--est)}.t-deload,.t-cirurgia{background:var(--del)}
.note{border-radius:14px;padding:12px 14px;font-size:15px;margin:8px 0}
.note.ok{background:var(--okbg);color:#14532d}.note.warn{background:var(--warnbg);color:#7c2d12}.note.bad{background:var(--badbg);color:#7f1d1d}.note.info{background:#eaf1fc;color:#13315f}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip .d{background:#fff;border-radius:12px;text-align:center;padding:6px 2px;font-size:12px;border:2px solid transparent}
.strip .d.today{border-color:var(--acc)}
.strip .d b{display:block;font-size:15px}
.strip .d .ic{font-size:15px;min-height:20px}
.strip .d.done{background:var(--okbg)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.tabs button span{font-size:23px;line-height:1}
.tabs button.on{color:var(--pri)}
.prog{height:14px;background:#e9eef6;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#4aa3ff,#1e5bb8);border-radius:99px;transition:width .4s}
.meal{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ex{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:#fff}
.ex.donex{border-color:#bfe6cd}
.exhead{display:flex;gap:10px;align-items:flex-start}
.exthumb{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:#e9eef6;display:flex;align-items:center;justify-content:center;font-size:26px;border:0}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.setrow .n{font-weight:800;color:var(--mut);text-align:center}
.setrow input{text-align:center;font-size:19px;font-weight:700;padding:8px}
.setok{width:52px;height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px}
.setok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fb{font-size:14px;margin-top:6px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.warn{color:var(--warn)}.fb.bad{color:var(--bad)}
.hist{font-size:14px;background:#f6f8fc;border-radius:12px;padding:8px 10px;margin-top:8px}
.hist div{display:flex;justify-content:space-between;gap:8px}
.goal{font-weight:800;color:var(--pri2)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:20px}
.sheet img.ph{width:100%;border-radius:14px;max-height:52vh;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:15px}
.chip.on{border-color:var(--pri);background:#eaf1fc;color:var(--pri2);font-weight:700}
ol.steps{padding-left:22px;margin:8px 0}ol.steps li{margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#14213d;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;max-width:92vw;text-align:center;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));background:var(--pri2);color:#fff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:30;max-width:536px;margin:0 auto}
.rest b{font-size:24px}
.rest[hidden],.toast[hidden]{display:none}
.btn.col{flex-direction:column;gap:0;line-height:1.15}
.hero{display:flex;gap:12px;align-items:center}
.hero .msg{font-weight:700;font-size:17px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpi div{background:#f6f8fc;border-radius:12px;padding:8px 4px}
.kpi b{display:block;font-size:19px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img,.photos .ph0{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#e9eef6;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}
.list-ex{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:10px}
.up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}
.weeks{display:flex;flex-direction:column;gap:6px}
.weeks .w{display:flex;justify-content:space-between;align-items:center;background:#f6f8fc;border-radius:12px;padding:8px 10px;font-size:15px}
.weeks .w.cur{outline:2px solid var(--acc)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.water{display:flex;gap:4px;margin:8px 0}
.water i{flex:1;height:26px;border-radius:6px;background:#e3edf9}
.water i.on{background:linear-gradient(180deg,#63b3ff,#1e74d8)}
a{color:var(--pri)}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.center{text-align:center}
</style>
</head>
<body>
<header class="top"><div class="wrap toprow">
  <img src="icon-192.png" alt="">
  <div><div class="brand">Strong Peggles</div><div class="sub" id="hdate"></div></div>
  <button class="gear" data-act="tab" data-tab="ajustes" aria-label="Ajustes">⚙️</button>
</div></header>
<main class="wrap" id="view"><div class="card">Carregando…</div></main>
<nav class="tabs" id="tabs"></nav>
<div id="toast" class="toast" hidden></div>
<div id="restbar" class="rest" hidden></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

const bestE=sets=>Math.max(...sets.map(x=>e1rm(x.kg,x.r)));
function refFor(ex,date,excludeId){
 const all=entriesFor(ex,excludeId).filter(e=>e.date<=date);const wk=monday(date);
 const ref=all.find(e=>PROGRESS_TYPES.has(e.wt)&&monday(e.date)!==wk)||all.find(e=>monday(e.date)!==wk)||null;
 const prevWeek=all.filter(e=>monday(e.date)===addDays(wk,-7));

function plan(ex,date,wt,n,excludeId){
 const {ref,prevWeek,all}=refFor(ex,date,excludeId);
 if(!ref) return {ref:null,prevWeek,all,kg:null,reps:Array(n).fill(null),txt:'Primeira vez: escolha um peso em que você consiga fazer entre 8 e 12 repetições bem feitas, parando quando sobrar 1 ou 2.'};
 const L=topLoad(ref.sets);const top=ref.sets.filter(x=>x.kg===L);const rr=i=>(top[i]||top[top.length-1]).r;
 let reps=[],txt='',up=false;
 if(PROGRESS_TYPES.has(wt)){
  if(top.every(x=>x.r>=12)){up=true;reps=Array(n).fill(8);txt=`Da última vez você passou de 12 com ${f1(L)} kg. Hora de SUBIR o peso (1 placa) e fazer de 6 a 10 repetições.`}
  else{reps=Array.from({length:n},(_,i)=>Math.min(12,rr(i)+1));txt=`Mesmo peso (${f1(L)} kg) e 1 repetição a mais em cada série.`}
 }else{
  reps=Array.from({length:n},(_,i)=>Math.max(6,rr(i)-2));
  txt=wt==='estabilizadora'?`Mesmo peso (${f1(L)} kg), 2 repetições a menos. Não precisa progredir.`:`Peso igual ou um pouco menor (${f1(L)} kg), 2 repetições a menos. Semana de recuperar.`;
 }
 return {ref,prevWeek,all,kg:L,reps,txt,up};
}
function improved(entrySets,ref){ // houve progresso real?
 if(!ref)return null;const L=topLoad(entrySets),RL=topLoad(ref.sets);
 if(L>RL)return true; if(L<RL)return bestE(entrySets)>bestE(ref.sets)*1.01;
 const a=entrySets.filter(x=>x.kg===L).map(x=>x.r),b=ref.sets.filter(x=>x.kg===RL).map(x=>x.r);const n=Math.min(a.length,b.length);
 let sa=0,sb=0;for(let i=0;i<n;i++){sa+=a[i];sb+=b[i]}return sa>sb||(a.length>b.length&&n>0&&sa>=sb);
}

function pendingDays(dateStr){ // treinos da semana que já deveriam ter sido feitos
 const m=monday(dateStr),done=doneThisWeek(dateStr),out=[];
 for(let i=0;i<7;i++){const d=addDays(m,i);if(d>=dateStr)break;const k=SCHED[dowOf(d)];if(k&&!done[k]&&d>=START&&!afterSurgery(d))out.push(k)}

/* ================= avaliação semanal (aumenta calorias sozinho) ================= */
function evaluateWeeks(){
 const t=today();let changed=false;const msgs=[];
 for(let m=START;addDays(m,7)<=t;m=addDays(m,7)){
  if(S.cfg.evals[m])continue;
  if(afterSurgery(m)){S.cfg.evals[m]={skip:true};continue}
  const ws=weightsBetween(m,addDays(m,6));const prev=weightsBetween(addDays(m,-7),addDays(m,-1));
  let gain=null,how='';
  if(ws.length>=3&&prev.length>=3){gain=avg(ws.map(x=>x.kg))-avg(prev.map(x=>x.kg));how='média da semana vs semana anterior'}
  else if(ws.length>=4){gain=avg(ws.slice(-2).map(x=>x.kg))-avg(ws.slice(0,2).map(x=>x.kg));how='fim vs começo da semana'}
  const wt=weekType(m);let loads=null,nRef=0,nUp=0;
  if(PROGRESS_TYPES.has(wt)){
   finishedSessions().filter(s=>monday(s.date)===m).forEach(s=>s.exs.forEach(e=>{const sets=e.sets.filter(x=>x.kg!=null&&x.r);if(!sets.length)return;const {ref}=refFor(e.ex,s.date,s.id);if(!ref||monday(ref.date)===m)return;nRef++;if(improved(sets,ref))nUp++}));
   if(nRef>=3)loads=nUp/nRef;
  }
  const threshold=how.startsWith('fim')?0.1:0.2;
  const weightBad=gain!=null&&gain<threshold;const loadsBad=loads!=null&&loads<0.5;
  let action='manter';
  if((weightBad||loadsBad)&&S.cfg.level<MAXLV){
   S.cfg.level++;action='subir';
   const why=[weightBad?`peso ${gain>=0?'subiu só':'caiu'} ${f1(Math.abs(gain))} kg`:null,loadsBad?`cargas progrediram em só ${Math.round(loads*100)}% dos exercícios`:null].filter(Boolean).join(' e ');
   S.cfg.levelLog.push({date:t,to:S.cfg.level,why:`Semana de ${fmtD(m)}: ${why}. Adicionado: ${LEVELS[S.cfg.level].txt}.`});
   msgs.push(`🍚 Sua dieta aumentou! ${LEVELS[S.cfg.level].txt}.`);
  }
  S.cfg.evals[m]={gain,how,loads,nRef,nUp,wt,action,level:S.cfg.level,nW:ws.length};changed=true;
 }
 if(changed)saveCfg();
 return msgs;
}

function strengthStats(){
 const ex={};finishedSessions().slice().reverse().forEach(s=>s.exs.forEach(e=>{const sets=e.sets.filter(x=>x.kg!=null&&x.r>0);if(!sets.length)return;(ex[e.ex]=ex[e.ex]||[]).push({date:s.date,e:bestE(sets),L:topLoad(sets),sets})}));
 const rows=Object.entries(ex).map(([id,a])=>({id,first:a[0],last:a[a.length-1],best:Math.max(...a.map(x=>x.e)),n:a.length,pct:(a[a.length-1].e/a[0].e-1)*100}));
 return rows;
}
function heroMessage(){
 const t=today();const fw=firstWeight(),lw=lastWeight();const rows=strengthStats().filter(r=>r.n>=2);const up=rows.filter(r=>r.pct>0.5);
 const msgs=[];
 if(up.length)msgs.push(`Você já está mais forte em ${up.length} exercício${up.length>1?'s':''}. Parabéns! 💪`);
 if(fw&&lw&&lw.kg-fw.kg>=0.3)msgs.push(`Você já ganhou ${sgn(lw.kg-fw.kg)} kg desde o começo. O músculo está chegando!`);
 const tr=finishedSessions().filter(s=>s.date>=START).length;if(tr>=1)msgs.push(`${tr} treino${tr>1?'s':''} feito${tr>1?'s':''}. Cada um deixa você mais preparado para a cirurgia.`);
 if(!msgs.length)msgs.push(pick(['Hoje é dia de construir músculo. Vamos juntos! 💪','Cada refeição e cada série contam. Bora!','Seu corpo forte agora = recuperação mais rápida depois.']));
 return pick(msgs);
}

const NTFY='https://ntfy.sh';
const APP_URL=location.origin+location.pathname;
const atTime=(dateStr,hhmm)=>{const [h,m]=hhmm.split(':').map(Number);const d=parseD(dateStr);d.setHours(h,m,0,0);return d.getTime()};
const minus=(hhmm,min)=>{const [h,m]=hhmm.split(':').map(Number);const t=h*60+m-min;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const plus=(hhmm,min)=>minus(hhmm,-min);
function mealTime(dateStr,mk){const r=S.cfg.rem;const dw=dowOf(dateStr);if(mk==='cafe')return plus(r.weigh[dw],15);if(dw===4&&r.thu&&r.thu[mk])return r.thu[mk];return r.meals[mk]}

function remindersFor(dateStr){
 const r=S.cfg.rem,on=r.on,dw=dowOf(dateStr),out=[];
 if(on.weigh)out.push({at:atTime(dateStr,r.weigh[dw]),title:'⚖️ Hora de se pesar em jejum',msg:'Suba na balança antes de comer ou beber e anote no Strong Peggles.',tags:'scales'});
 if(on.meals){const tr=SCHED[dw]&&!afterSurgery(dateStr);
  out.push({at:atTime(dateStr,mealTime(dateStr,'cafe')),title:'☕ Café da manhã',msg:(tr?`Hoje tem ${PROGRAM[SCHED[dw]].name}! `:'')+'Depois de comer, marque o check-in no app.',tags:'coffee'});
  out.push({at:atTime(dateStr,mealTime(dateStr,'almoco')),title:'🍛 Hora do almoço',msg:'Coma toda a proteína do prato e marque o check-in no app.',tags:'rice'});
  out.push({at:atTime(dateStr,mealTime(dateStr,'lanche')),title:'🍌 Hora do lanche',msg:'Lanche igual ao café da manhã. Depois marque o check-in.',tags:'banana'});
  out.push({at:atTime(dateStr,mealTime(dateStr,'jantar')),title:'🍽️ Hora do jantar',msg:'Jantar igual ao almoço. Depois marque o check-in.',tags:'plate_with_cutlery'});}
 if(on.water)r.water.forEach((h,i)=>out.push({at:atTime(dateStr,h),title:'💧 Beba água',msg:WATER_MSG[i%WATER_MSG.length],tags:'droplet'}));
 if(on.train&&SCHED[dw]&&r.train[dw]&&!afterSurgery(dateStr)&&dateStr>=START){const k=SCHED[dw];out.push({at:atTime(dateStr,r.train[dw]),title:`💪 Treino ${k} daqui a pouco`,msg:`${PROGRAM[k].name}. Abra o app na academia para ver a meta de cada exercício.`+(HIDRO.has(dw)?' Depois tem hidro!':''),tags:'muscle'})}
 if(on.photo&&dw===0)out.push({at:atTime(dateStr,r.photo),title:'📸 Foto da semana',msg:'Domingo é dia da foto sem camisa. Mesmo lugar e mesma luz. Abra o app para ver como fazer.',tags:'camera'});
 return out;

async function scheduleReminders(force){
 const n=S.cfg.ntfy;if(!n.on||!n.topic)return;
 const now=Date.now(),horizon=now+70*3600e3;let from=Math.max(now+60e3,n.until||0);
 if(!force&&horizon-from<6*3600e3)return; // já está agendado
 const ev=[];for(let d=iso(new Date(from));atTime(d,'00:00')<=horizon;d=addDays(d,1))remindersFor(d).forEach(e=>{if(e.at>from&&e.at<=horizon)ev.push(e)});
 ev.sort((a,b)=>a.at-b.at);let ok=0;
 for(const e of ev){
  try{const r=await fetch(NTFY+'/',{method:'POST',body:JSON.stringify({topic:n.topic,title:e.title,message:e.msg,tags:[e.tags],click:APP_URL,delay:String(Math.floor(e.at/1000)),priority:e.tags==='scales'?4:3})});
   if(!r.ok)throw new Error('HTTP '+r.status);ok++;n.until=e.at;}
  catch(err){n.err=String(err.message||err)+' em '+new Date().toLocaleString('pt-BR');break}
  await new Promise(r=>setTimeout(r,250));
 }
 if(ok===ev.length)n.until=Math.max(n.until||0,horizon),n.err=null;
 n.last=Date.now();await saveCfg();
}

function weekStrip(dateStr){

 return h+'</div>';
}

function setFeedback(x,p,j,wt){
 if(x.r==null||x.kg==null)return '';
 if(x.r>12)return '<span class="fb warn">Passou de 12: está leve! Na próxima série aumente o peso. 💪</span>';
 if(x.r<6)return '<span class="fb bad">Menos de 6: está pesado. Diminua um pouco o peso.</span>';
 if(p.ref&&PROGRESS_TYPES.has(wt)){const L=topLoad(p.ref.sets);const rs=(p.ref.sets.filter(s=>s.kg===L)[j]||{}).r;
  if(x.kg>L)return '<span class="fb ok">🔥 Peso maior que da última vez! Você está ficando mais forte!</span>';
  if(x.kg===L&&rs!=null&&x.r>rs)return '<span class="fb ok">🔥 Superou a última vez! Você está ficando mais forte!</span>';
  if(x.kg===L&&rs!=null&&x.r===rs)return '<span class="fb ok">Igualou a última vez. Na próxima tente +1!</span>';
 }

function finishSession(){

function weightChart(){
 const pts=weightsBetween('2026-01-01','2099-01-01');if(pts.length<2)return '<div class="small muted">O gráfico aparece depois de 2 pesagens.</div>';
 const W=520,H=200,pad=30;const xs=pts.map(p=>parseD(p.d).getTime()),ys=pts.map(p=>p.kg);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-0.5,y1=Math.max(...ys)+0.5;
 const X=t=>pad+(W-pad-8)*(x1===x0?0.5:(t-x0)/(x1-x0)),Y=v=>H-pad+(-(H-pad-10))*((v-y0)/(y1-y0));
 // média móvel 7 dias
 const ma=pts.map(p=>{const a=pts.filter(q=>q.d<=p.d&&q.d>addDays(p.d,-7)).map(q=>q.kg);return {d:p.d,kg:avg(a)}});
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
 for(let k=0;k<=3;k++){const v=y0+(y1-y0)*k/3;s+=`<line x1="${pad}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e1e7f0"/><text x="2" y="${Y(v)+4}" font-size="11" fill="#5b6b82">${f1(v)}</text>`}
 s+=`<polyline fill="none" stroke="#9db8e0" stroke-width="2" points="${pts.map(p=>X(parseD(p.d).getTime())+','+Y(p.kg)).join(' ')}"/>`;
 s+=`<polyline fill="none" stroke="#1e5bb8" stroke-width="3.5" stroke-linejoin="round" points="${ma.map(p=>X(parseD(p.d).getTime())+','+Y(p.kg)).join(' ')}"/>`;
 pts.forEach(p=>s+=`<circle cx="${X(parseD(p.d).getTime())}" cy="${Y(p.kg)}" r="3" fill="#9db8e0"/>`);
 s+=`<text x="${pad}" y="${H-8}" font-size="11" fill="#5b6b82">${fmtD(pts[0].d)}</text><text x="${W-40}" y="${H-8}" font-size="11" fill="#5b6b82">${fmtD(pts[pts.length-1].d)}</text></svg>`;
 return s+'<div class="tiny muted">Linha azul forte = média de 7 dias (é ela que importa, o peso do dia varia).</div>';
}

function compressImage(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1000;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,m/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.8))};img.onerror=rej;img.src=u})}
function dataURLtoFile(d,name){const [h,b]=d.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new File([a],name,{type:'image/jpeg'})}

function showModal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="sheet">${html}</div>`;m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m)}
function closeModal(){const m=$('#modal');if(m)m.remove()}
function exInfo(id){const d=EX[id];if(!d)return;showModal(`<h2>${esc(d[0])}</h2>${d[2]?`<img class="ph" src="img/${d[2]}.jpg" alt="Máquina da sua academia"><div class="tiny muted">📍 Máquina da sua academia</div>`:''}${ILU[id]?`<div style="margin-top:10px;border:2px solid var(--line);border-radius:14px;padding:8px;background:#fff"><div class="row between small" style="font-weight:700;padding:0 6px"><span>1. Início</span><span>2. Fim</span></div><img src="ilu/${ILU[id]}.png" alt="Como fazer" style="width:100%;display:block">${ILU_NOTE[id]?`<div class="tiny" style="margin-top:4px">ℹ️ ${ILU_NOTE[id]}</div>`:''}<div class="tiny muted" style="margin-top:4px">Ilustração: Everkinetic (CC BY-SA)</div></div>`:''}<div class="small muted" style="margin-top:6px">Músculo: ${esc(d[1])}</div><ol class="steps">${d[3].map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="note warn">⚠️ ${esc(d[4])}</div><div class="note info small">Na primeira vez, peça ao professor da academia para ajustar a máquina com você.</div><a class="btn acc block" href="${YT(d[0])}" target="_blank" rel="noopener">▶ Ver vídeo de execução</a><button class="btn ghost block" style="margin-top:8px" data-act="close">Fechar</button>`)}
function swapMenu(i){const s=S.sess[S.draft];const e=s.exs[i];const it=PROGRAM[s.day].items[e.slot];const opts=[it.ex,...it.alts];
 showModal(`<h2>Trocar máquina</h2><div class="small muted">Use se a máquina estiver ocupada ou se não tiver na academia. O app guarda a escolha para os próximos treinos.</div>${opts.map(o=>`<button class="btn ${o===e.ex?'pri':'ghost'} block" style="margin-top:8px;justify-content:flex-start" data-act="doswap" data-i="${i}" data-ex="${o}">${o===e.ex?'✓ ':''}${esc(exName(o))}</button>`).join('')}<button class="btn ghost block" style="margin-top:12px" data-act="close">Cancelar</button>`)}

/* ---------- descanso ---------- */
function startRest(sec){S.restEnd=Date.now()+sec*1000;tickRest()}
function tickRest(){const el=$('#restbar');const left=Math.ceil((S.restEnd-Date.now())/1000);if(left<=0){if(!el.hidden){el.hidden=true;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}toast('Descanso acabou: próxima série! 💪')}return}
 el.hidden=false;el.innerHTML=`<span>⏱️ Descanso</span><b>${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b><span style="flex:1"></span><button class="btn sm" data-act="rest30">+30s</button><button class="btn sm" data-act="restskip">Pular</button>`;clearTimeout(tickRest._t);tickRest._t=setTimeout(tickRest,500)}

/* ---------- backup ---------- */
function backupObj(){return {app:'strong-peggles',v:APP_VERSION,at:new Date().toISOString(),cfg:S.cfg,sess:S.sess,w:S.w,d:S.d}}
async function doBackup(){
 const name=`strong-peggles-${today()}.json`;const blob=new Blob([JSON.stringify(backupObj())],{type:'application/json'});const file=new File([blob],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Cópia Strong Peggles',text:'Cópia de segurança do Strong Peggles'});}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
  S.cfg.lastBackup=today();saveCfg();toast('Cópia feita ✓');render()}catch(e){if(e.name!=='AbortError')toast('Não consegui compartilhar')}
}
async function doImport(file){try{const o=JSON.parse(await file.text());if(o.app!=='strong-peggles')throw 0;
 await DB.put('cfg',o.cfg);for(const [k,v] of Object.entries(o.sess||{}))await DB.put('sess:'+k,v);for(const [k,v] of Object.entries(o.w||{}))await DB.put('w:'+k,v);for(const [k,v] of Object.entries(o.d||{}))await DB.put('d:'+k,v);
 toast('Cópia restaurada ✓');setTimeout(()=>location.reload(),800)}catch(e){toast('Arquivo inválido')}}
function weekReport(){
 const t=today(),m=monday(t);const lm=addDays(m,-7);const a=weekAvg(lm),b=weekAvg(addDays(lm,-7));const tr=finishedSessions().filter(s=>monday(s.date)===lm).length;
 const ev=S.cfg.evals[lm];const lw=lastWeight(),fw=firstWeight();
 let water=0,meals=0;for(let i=0;i<7;i++){const r=dayRec(addDays(lm,i));if((r.water||0)>=S.cfg.waterGoal)water++;meals+=Object.values(r.meals||{}).filter(x=>!x.skip).length}
 const rows=strengthStats().filter(r=>r.n>=2);const up=rows.filter(r=>r.pct>0.5).length;
 return `💪 *Strong Peggles* · semana de ${fmtD(lm)}\n⚖️ Média de peso: ${a!=null?f1(a)+' kg':'–'}${a!=null&&b!=null?' ('+sgn(a-b)+' kg)':''}\n📈 Desde o início: ${fw&&lw?sgn(lw.kg-fw.kg)+' kg':'–'}\n🏋️ Treinos: ${tr} de 4 · mais forte em ${up} de ${rows.length} exercícios\n🍽️ Refeições marcadas: ${meals} de 28\n💧 Dias com 3 L de água: ${water} de 7\n🍚 Nível da dieta: ${S.cfg.level} (${f0(planTotals(S.cfg.level).kcal)} kcal)${ev&&ev.action==='subir'?' ⬆️ aumentou':''}`;
}

/* ---------- eventos ---------- */
function after(){
 const v=$('#view');
 v.querySelectorAll('[data-in]').forEach(inp=>{inp.oninput=inp.onchange=()=>{const s=S.sess[S.draft];if(!s)return;const i=+inp.dataset.i,j=+inp.dataset.j;const x=s.exs[i].sets[j];x[inp.dataset.in]=num(inp.value);
  if(inp.dataset.in==='kg'&&j===0){for(let k=1;k<s.exs[i].sets.length;k++){const y=s.exs[i].sets[k];if(!y.done&&y.r==null){y.kg=x.kg;const o=v.querySelector(`[data-in="kg"][data-i="${i}"][data-j="${k}"]`);if(o)o.value=inp.value}}}
  saveSess(s);const p=plan(s.exs[i].ex,s.date,s.wt,s.exs[i].sets.length,s.id);const fb=$('#fb'+i+'_'+j);if(fb)fb.innerHTML=setFeedback(x,p,j,s.wt)}});
 v.querySelectorAll('[data-rem]').forEach(inp=>inp.onchange=()=>{const [a,b]=inp.dataset.rem.split('.');if(!inp.value)return;S.cfg.rem[a][b]=inp.value;saveCfg();toast('Horário salvo')});
 v.querySelectorAll('[data-prof]').forEach(inp=>inp.onchange=()=>{S.cfg.profile[inp.dataset.prof]=num(inp.value);saveCfg();toast('Salvo')});
 const sg=$('#surg');if(sg)sg.onchange=()=>{S.cfg.surgery=sg.value||null;saveCfg();toast('Data salva')};
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const t=today();
 if(a==='tab'){S.tab=b.dataset.tab;closeModal();render();window.scrollTo(0,0);return}
 if(a==='close'){closeModal();return}
 if(a==='savew'){const v=num($('#wIn').value);if(v==null||v<35||v>200){toast('Digite o peso, ex: 84,2');return}S.w[t]={kg:v,t:Date.now()};await DB.put('w:'+t,S.w[t]);
  const prevAvg=avg(weightsBetween(addDays(t,-7),addDays(t,-1)).map(x=>x.kg));toast(prevAvg!=null&&v>prevAvg?'Peso anotado ✓ Subindo! O músculo está chegando 💪':'Peso anotado ✓ Bom dia, campeão!');render();return}
 if(a==='editw'){delete S.w[t];await DB.del('w:'+t);render();setTimeout(()=>$('#wIn')&&$('#wIn').focus(),50);return}
 if(a==='water'){const r=dayRec(t);const before=r.water||0;r.water=Math.max(0,before+ +b.dataset.ml);await saveDay(t,r);if(before<S.cfg.waterGoal&&r.water>=S.cfg.waterGoal){confetti();toast('3 litros! Meta de água batida! 💧🏆')}else if(+b.dataset.ml>0)toast(`💧 ${f1(r.water/1000)} L de ${f1(S.cfg.waterGoal/1000)} L`);render();return}
 if(a==='hidro'){const r=dayRec(t);r.hidro=!r.hidro;await saveDay(t,r);if(r.hidro)toast('Hidro feita! 🏊 Corpo ativo, coração forte');render();return}
 if(a==='meal'){openMeal(b.dataset.meal);return}
 if(a==='start'){if(S.draft&&S.sess[S.draft]){S.tab='treino';render();return}startSession(b.dataset.day);return}
 if(a==='info'){exInfo(b.dataset.ex);return}
 if(a==='swap'){swapMenu(+b.dataset.i);return}
 if(a==='doswap'){const s=S.sess[S.draft];const i=+b.dataset.i;const e=s.exs[i];const ex=b.dataset.ex;S.cfg.swaps[s.day+':'+e.slot]=ex;saveCfg();e.ex=ex;const p=plan(ex,s.date,s.wt,e.sets.length,s.id);e.sets=e.sets.map(()=>({kg:p.kg,r:null,done:false}));saveSess(s);closeModal();render();setTimeout(()=>{const el=$('#ex'+i);el&&el.scrollIntoView({block:'center'})},50);return}
 if(a==='setok'){const s=S.sess[S.draft];const i=+b.dataset.i,j=+b.dataset.j;const x=s.exs[i].sets[j];
  const ki=$(`[data-in="kg"][data-i="${i}"][data-j="${j}"]`),ri=$(`[data-in="r"][data-i="${i}"][data-j="${j}"]`);x.kg=num(ki.value);x.r=num(ri.value);
  if(!x.done&&(x.kg==null||x.r==null)){toast('Anote o peso e as repetições');return}
  x.done=!x.done;await saveSess(s);b.classList.toggle('on',x.done);
  if(x.done){const last=s.exs.every(e=>e.sets.every(y=>y.done));if(!last)startRest(90);const ex=$('#ex'+i);if(s.exs[i].sets.every(y=>y.done))ex.classList.add('donex');
   const p=plan(s.exs[i].ex,s.date,s.wt,s.exs[i].sets.length,s.id);const fb=setFeedback(x,p,j,s.wt);if(/mais forte/.test(fb))toast('🔥 Você está ficando mais forte! Parabéns!');}
  return}
 if(a==='addset'){const s=S.sess[S.draft];const e=s.exs[+b.dataset.i];const l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:null,r:null,done:false});await saveSess(s);render();return}
 if(a==='rmset'){const s=S.sess[S.draft];const e=s.exs[+b.dataset.i];e.sets.pop();await saveSess(s);render();return}
 if(a==='finish'){finishSession();return}
 if(a==='discard'){if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Toque de novo para descartar';return}const id=S.draft;delete S.sess[id];await DB.del('sess:'+id);S.draft=null;render();return}
 if(a==='editsess'){const s=S.sess[b.dataset.id];if(!s)return;if(S.draft&&S.sess[S.draft]){toast('Termine o treino em andamento primeiro');return}s.finished=false;s.exs.forEach(e=>e.sets.forEach(x=>x.done=true));await saveSess(s);S.draft=s.id;render();return}
 if(a==='rest30'){S.restEnd+=30000;tickRest();return}
 if(a==='restskip'){S.restEnd=0;$('#restbar').hidden=true;return}
 if(a==='photo'){S.photoPos=b.dataset.pos;$('#photoInput').click();return}
 if(a==='sharephotos'){const r=S.ph[b.dataset.d];const files=['frente','lado','costas'].filter(p=>r[p]).map(p=>dataURLtoFile(r[p],`foto-${p}-${b.dataset.d}.jpg`));
  try{if(navigator.canShare&&navigator.canShare({files}))await navigator.share({files,text:`Fotos da semana · ${fmtD(b.dataset.d)} · peso ${f1(weightOn(b.dataset.d)??lastWeight()?.kg)} kg`});else toast('Este celular não deixa compartilhar fotos daqui.')}catch(err){}return}
 if(a==='ntfyon'){S.cfg.ntfy.on=!S.cfg.ntfy.on;S.cfg.ntfy.until=S.cfg.ntfy.on?S.cfg.ntfy.until:0;await saveCfg();render();if(S.cfg.ntfy.on){toast('Agendando lembretes…');await scheduleReminders(true);toast(S.cfg.ntfy.err?'Falhou: confira a internet':'Lembretes agendados ✓');render()}return}
 if(a==='ntfytest'){ntfyTest();return}
 if(a==='copytopic'){try{await navigator.clipboard.writeText(S.cfg.ntfy.topic);toast('Copiado')}catch(e){toast(S.cfg.ntfy.topic)}return}
 if(a==='remon'){const k=b.dataset.k;S.cfg.rem.on[k]=!S.cfg.rem.on[k];await saveCfg();render();return}
 if(a==='lv'){S.cfg.level=Math.max(0,Math.min(MAXLV,S.cfg.level+ +b.dataset.d));S.cfg.levelLog.push({date:t,to:S.cfg.level,why:'Ajuste manual.'});await saveCfg();render();return}
 if(a==='backup'){doBackup();return}
 if(a==='import'){$('#importInput').click();return}
 if(a==='report'){const txt=weekReport();try{if(navigator.share)await navigator.share({text:txt});else location.href='https://wa.me/?text='+encodeURIComponent(txt)}catch(err){}return}
});
$('#photoInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=await compressImage(f);const t=today();const wk=monday(t);const key=Object.keys(S.ph).filter(x=>monday(x)===wk).pop()||t;const r=S.ph[key]||{};r[S.photoPos]=d;S.ph[key]=r;await DB.put('ph:'+key,r);const n=['frente','lado','costas'].filter(p=>r[p]).length;toast(n===3?'Fotos da semana completas! 📸':'Foto salva ✓');if(n===3)confetti();render()}catch(err){toast('Não consegui abrir a foto')}};
$('#importInput').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)doImport(f)};

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});
 fetch('version.json',{cache:'no-store'}).then(r=>r.json()).then(o=>{if(o.v&&o.v!==APP_VERSION&&!sessionStorage.getItem('upd'+o.v)){sessionStorage.setItem('upd'+o.v,1);navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).finally(()=>setTimeout(()=>location.reload(),600))}}).catch(()=>{})}

(async()=>{
 await load();
 S.weekMsgs=evaluateWeeks();
 if(location.hash==='#treino')S.tab='treino';
 render();
 scheduleReminders(false);
 setInterval(()=>scheduleReminders(false),3600e3);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){scheduleReminders(false);if(!S.draft)render()}});
})();
})();
</script>
</body>
